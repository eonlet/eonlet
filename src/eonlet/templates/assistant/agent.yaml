apiVersion: eonlet/v1
kind: Agent

metadata:
  name: assistant
  description: "General-purpose interactive assistant with persistent notes"
  version: 0.1.0
  authors: ["Eonlet contributors"]
  tags: [interactive, general, default]
  specialty: general_assistance
  capabilities:
    - "general.conversation"
    - "research.web"
    - "write.code"
    - "manage.notes"

runtime:
  model: deepseek-v4-pro@deepseek
  fallback_model: deepseek-v4-flash@deepseek
  max_context_tokens: 180000
  max_steps_per_run: 100
  budget:
    daily_usd: 5.0
    on_exceed: warn

# No triggers section -- this agent is purely interactive.
# It waits for the user to `eonlet attach` and chat.

tools:
  builtin:
    - bash
    - file_read
    - file_write
    - file_edit
    - glob
    - grep
    - web_search
    - web_fetch
    - knowledge               # curated knowledge base (ADR-0005)
    - task                    # action items / workflow state
    - recall
    - memory
    - load_skill
    - sleep
    - schedule

permissions:
  mode: ask                    # always ask before destructive tool calls

memory:
  enabled: true
  compaction_model: deepseek-v4-flash@deepseek
  inject_turn_timestamps: true       # stamp each user turn with its local datetime
  episodic:                    # the conversation timeline: working → STM → LTM
    working_memory_tokens: 12000     # higher cap for chatty interactive use
    keep_recent_messages_min: 6
    short_term_tokens: 4000
    long_term_tokens: 8000
    auto_compact: true
    propose_semantic: true           # let the agent propose folding away stale context
    propose_floor_tokens: 6000       # …but only once the window is sizeable
    propose_min_interval_seconds: 1800
    propose_min_turns: 3
  knowledge:                   # curated, hierarchical knowledge tree (never auto-deleted)
    inject_index: true

tasks:                         # action items — workflow state, not memory
  inject_pending: true
  scheduling:                  # ADR-0007 — run slightly-complex work as tasks
    enabled: true
    preempt: ask               # ask before pausing a task for a higher-priority one

lifecycle:
  on_crash: warn               # MVP: just log; v0.4+ supervisor will auto-restart
